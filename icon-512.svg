<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad1)"/>
  
  <!-- Grid/List Icon representing features -->
  <g transform="translate(128, 128)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="100" y="0" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="200" y="0" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    
    <!-- Row 2 -->
    <rect x="0" y="100" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="100" y="100" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="200" y="100" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    
    <!-- Row 3 -->
    <rect x="0" y="200" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="100" y="200" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    <rect x="200" y="200" width="80" height="80" rx="12" fill="white" opacity="0.9"/>
    
    <!-- Checkmark overlay on center item -->
    <path d="M 140 180 L 160 200 L 200 160" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="432" cy="80" r="48" fill="white" opacity="0.2"/>
  <circle cx="80" cy="432" r="40" fill="white" opacity="0.2"/>
  <circle cx="480" cy="400" r="24" fill="white" opacity="0.2"/>
</svg>

