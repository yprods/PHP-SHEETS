<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#grad1)"/>
  
  <!-- Grid/List Icon representing features -->
  <g transform="translate(48, 48)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="40" y="0" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="80" y="0" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Row 2 -->
    <rect x="0" y="40" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="40" y="40" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="80" y="40" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Row 3 -->
    <rect x="0" y="80" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="40" y="80" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    <rect x="80" y="80" width="32" height="32" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Checkmark overlay on center item -->
    <path d="M 52 68 L 60 76 L 76 60" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative circle -->
  <circle cx="160" cy="32" r="20" fill="white" opacity="0.2"/>
  <circle cx="32" cy="160" r="16" fill="white" opacity="0.2"/>
</svg>

